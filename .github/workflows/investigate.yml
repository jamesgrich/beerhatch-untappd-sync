name: Investigate Product

on:
  workflow_dispatch:
    inputs:
      search:
        description: "Search term (e.g. radler)"
        required: true
        default: "radler"

jobs:
  investigate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: node investigate.js
        env:
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
          UT_EMAIL: ${{ secrets.UT_EMAIL }}
          UT_TOKEN: ${{ secrets.UT_TOKEN }}
          SEARCH: ${{ inputs.search }}
