name: Untappd to Shopify Sync

run-name: >-
  Sync (${{ github.event_name == 'schedule' && 'GH schedule fallback' || inputs.source == 'netlify' && 'Netlify scheduler' || 'manual' }})

on:
  # Netlify's scheduled function (netlify/functions/trigger-sync.js) is the primary
  # driver now, firing workflow_dispatch every 30 min — GH's own `schedule:` trigger
  # got delayed by hours on this repo regardless of cron offset. This schedule is a
  # TEMPORARY safety net (2hr floor, not 30min) in case the Netlify trigger turns out
  # not to fire at all — remove once that's confirmed working, to avoid doubling
  # collision risk on the commit step below for no benefit.
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Who triggered this (netlify / left blank for manual)"
        required: false
        default: "manual"

jobs:
  sync:
    runs-on: ubuntu-latest
    concurrency:
      group: sync
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - run: node sync.js
        env:
          UT_EMAIL: ${{ secrets.UT_EMAIL }}
          UT_TOKEN: ${{ secrets.UT_TOKEN }}
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}

      - name: Commit updated products.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/products.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "chore: update products.json [skip ci]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "Push rejected, pulling and retrying ($i/5)..."
            git pull --rebase origin main
            sleep $((RANDOM % 8 + 3))
          done
          echo "::error::Failed to push products.json after 5 retries"
          exit 1
