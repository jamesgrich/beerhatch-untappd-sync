name: Untappd to Shopify Sync

on:
  # Netlify's scheduled function (netlify/functions/trigger-sync.js) now drives this
  # every 30 min via workflow_dispatch — GH's own `schedule:` trigger got delayed by
  # hours on this repo regardless of cron offset, and running both doubled collision
  # risk on the commit step below for no benefit.
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    concurrency:
      group: sync
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - run: node sync.js
        env:
          UT_EMAIL: ${{ secrets.UT_EMAIL }}
          UT_TOKEN: ${{ secrets.UT_TOKEN }}
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}

      - name: Commit updated products.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/products.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "chore: update products.json [skip ci]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "Push rejected, pulling and retrying ($i/5)..."
            git pull --rebase origin main
            sleep $((RANDOM % 8 + 3))
          done
          echo "::error::Failed to push products.json after 5 retries"
          exit 1
