name: Untappd to Shopify Sync

run-name: >-
  Sync (${{ inputs.source == 'netlify' && 'Netlify scheduler' || inputs.source == 'cron-job.org' && 'cron-job.org scheduler' || 'manual' }})

on:
  # Two independent, offset external schedulers drive this via workflow_dispatch —
  # Netlify (:00/:10/:20/:30/:40/:50) and cron-job.org (:05/:15/:25/:35/:45/:55) —
  # interleaved for a combined ~5min effective cadence with no overlap. Either one
  # alone degrades gracefully to a 10min cadence rather than silent total failure.
  # GH's own `schedule:` trigger was removed entirely: it got delayed by hours on
  # this repo regardless of cron offset, so it added no real reliability and only
  # increased collision risk on the commit step below.
  workflow_dispatch:
    inputs:
      source:
        description: "Who triggered this (netlify / cron-job.org / left blank for manual)"
        required: false
        default: "manual"

jobs:
  sync:
    runs-on: ubuntu-latest
    concurrency:
      group: sync
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - run: node sync.js
        env:
          UT_EMAIL: ${{ secrets.UT_EMAIL }}
          UT_TOKEN: ${{ secrets.UT_TOKEN }}
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}

      - name: Commit updated products.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/products.json public/sync-state.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "chore: update products.json [skip ci]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "Push rejected, pulling and retrying ($i/5)..."
            git pull --rebase origin main
            sleep $((RANDOM % 8 + 3))
          done
          echo "::error::Failed to push products.json after 5 retries"
          exit 1
