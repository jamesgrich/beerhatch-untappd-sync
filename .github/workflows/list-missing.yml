name: List products missing from Untappd menu

on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: node list-missing.js
        env:
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
          UT_EMAIL: ${{ secrets.UT_EMAIL }}
          UT_TOKEN: ${{ secrets.UT_TOKEN }}
