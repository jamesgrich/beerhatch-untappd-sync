name: Upload Pending Photos to Shopify

on:
  push:
    paths:
      - "pending-photos/**"

jobs:
  upload:
    runs-on: ubuntu-latest
    concurrency:
      group: upload-photos
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - run: node process-pending-photos.js
        env:
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}

      - name: Remove processed photos from repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pending-photos/
          git diff --staged --quiet || (git commit -m "chore: remove processed photos [skip ci]" && git push)
